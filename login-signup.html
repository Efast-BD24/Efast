<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login / Signup - Efast</title>

    <!-- 🛡️ VPN + Network Guard -->
    <script src="guard.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- ═══ FIREBASE SDK v12.19.0 ═══ -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #030712;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -20%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.15) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -20%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        .auth-container { width: 100%; max-width: 420px; position: relative; z-index: 1; }

        .brand-header { text-align: center; margin-bottom: 28px; }
        .brand-logo {
            width: 70px; height: 70px; border-radius: 20px;
            background: linear-gradient(135deg, #1e40af 0%, #7e22ce 100%);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 32px; margin-bottom: 14px;
            box-shadow: 0 20px 40px rgba(126, 34, 206, 0.35);
        }
        .brand-header h1 {
            font-size: 26px; font-weight: 900; letter-spacing: -0.03em;
            font-style: italic; color: #60a5fa;
        }
        .brand-header h1 span {
            background: #2563eb; color: white; font-size: 11px;
            padding: 3px 10px; border-radius: 999px; font-style: normal;
            vertical-align: middle; margin-left: 6px;
        }
        .brand-header p {
            color: #6b7280; font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px; padding: 32px 26px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex; background: rgba(0, 0, 0, 0.3);
            border-radius: 16px; padding: 5px; margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab {
            flex: 1; padding: 12px; text-align: center;
            font-size: 13px; font-weight: 800; color: #6b7280;
            border-radius: 12px; cursor: pointer; transition: all 0.25s;
            user-select: none; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .tab.active {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; font-size: 11px; color: #9ca3af;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            margin-bottom: 6px; padding-left: 4px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper i.input-icon {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); color: #6b7280;
            font-size: 14px; pointer-events: none; transition: color 0.2s;
        }
        .input-wrapper input {
            width: 100%; padding: 14px 16px 14px 44px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; color: white; font-size: 14px;
            outline: none; font-family: inherit; transition: all 0.2s;
            font-weight: 500;
        }
        .input-wrapper input:focus {
            border-color: #3b82f6; background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .input-wrapper input:focus ~ i.input-icon { color: #3b82f6; }
        .input-wrapper input::placeholder { color: #4b5563; }

        .toggle-pwd {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%); color: #6b7280;
            cursor: pointer; font-size: 14px; background: none;
            border: none; padding: 4px; transition: color 0.2s;
        }
        .toggle-pwd:hover { color: #9ca3af; }

        .submit-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none; border-radius: 14px; color: white;
            font-size: 14px; font-weight: 800; cursor: pointer;
            font-family: inherit; text-transform: uppercase;
            letter-spacing: 0.05em; transition: all 0.25s;
            margin-top: 8px; position: relative; overflow: hidden;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
        }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled {
            opacity: 0.6; cursor: not-allowed;
            transform: none; box-shadow: none;
        }

        .forgot-link { text-align: right; margin-top: -8px; margin-bottom: 16px; }
        .forgot-link button {
            background: none; border: none; color: #60a5fa;
            font-size: 12px; font-weight: 700; cursor: pointer;
            font-family: inherit; padding: 4px 0;
        }
        .forgot-link button:hover { text-decoration: underline; }

        .referral-box {
            background: rgba(34, 197, 94, 0.08);
            border: 1px dashed rgba(34, 197, 94, 0.4);
            border-radius: 14px; padding: 12px 16px; margin-bottom: 16px;
        }
        .referral-box label {
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; color: #4ade80; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
        }
        .referral-box input {
            width: 100%; padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 10px; color: white; font-size: 13px;
            outline: none; font-family: inherit; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
        }
        .referral-box input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }
        .referral-box input::placeholder {
            color: #4b5563; font-weight: 500;
            letter-spacing: normal; text-transform: none;
        }

        /* ✅ Google Sign In Divider & Button Styles */
        .divider {
            display: flex; align-items: center; margin: 20px 0;
        }
        .divider-line {
            flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);
        }
        .divider-text {
            padding: 0 12px; font-size: 12px; color: #6b7280; font-weight: 700;
        }
        .google-btn {
            width: 100%; padding: 14px;
            background: #ffffff; color: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px; font-weight: 800;
            font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: inherit; transition: all 0.25s;
        }
        .google-btn:hover {
            background: #f3f4f6; transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .google-btn:active { transform: translateY(0); }
        .google-btn img { width: 20px; height: 20px; }

        .bottom-text {
            text-align: center; margin-top: 22px;
            font-size: 13px; color: #6b7280; font-weight: 500;
        }
        .bottom-text button {
            background: none; border: none; color: #60a5fa;
            font-weight: 800; cursor: pointer; font-family: inherit;
            font-size: 13px; padding: 0 4px;
        }
        .bottom-text button:hover { text-decoration: underline; }

        #toast-container {
            position: fixed; top: 24px; left: 50%;
            transform: translateX(-50%); z-index: 9999;
            width: 90%; max-width: 380px; pointer-events: none;
        }
        .toast {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 18px; border-radius: 16px;
            color: white; font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 8px; animation: slideDown 0.35s ease-out;
            pointer-events: auto;
        }
        .toast i { font-size: 1.1rem; }
        .toast-success { border-left: 3px solid #34d399; }
        .toast-success i { color: #34d399; }
        .toast-error { border-left: 3px solid #f87171; }
        .toast-error i { color: #f87171; }
        .toast-info { border-left: 3px solid #60a5fa; }
        .toast-info i { color: #60a5fa; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loader {
            display: none; position: fixed; inset: 0;
            background: rgba(3, 7, 18, 0.9); z-index: 9998;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 16px; backdrop-filter: blur(4px);
        }
        #loader.active { display: flex; }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            color: #6b7280; font-size: 0.85rem; font-weight: 700;
            letter-spacing: 0.15em; text-transform: uppercase;
        }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.8); z-index: 9997;
            align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(6px);
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: rgba(20, 25, 40, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 26px; width: 100%;
            max-width: 380px; animation: slideDown 0.3s ease-out;
        }
        .modal-card h3 { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
        .modal-card p { font-size: 13px; color: #9ca3af; margin-bottom: 18px; }

        .footer-note {
            text-align: center; font-size: 11px; color: #4b5563;
            margin-top: 18px; line-height: 1.6;
        }
        .footer-note a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Please wait...</div>
    </div>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">⚡</div>
            <h1>TASKCASH <span>PRO</span></h1>
            <p>Welcome to Efast</p>
        </div>

        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
                <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('loginPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="forgot-link">
                    <button type="button" onclick="openForgotModal()">Forgot Password?</button>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt mr-2"></i> Login
                </button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signupName" placeholder="Your full name" required maxlength="60" />
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-wrapper">
                        <input type="tel" id="signupPhone" placeholder="01XXXXXXXXX" required maxlength="11" />
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password" />
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('signupPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupConfirm" placeholder="Re-enter password" required minlength="6" autocomplete="new-password" />
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>

                <div class="referral-box">
                    <label><i class="fas fa-gift"></i> Referral Code (Optional)</label>
                    <input type="text" id="signupReferral" placeholder="Enter referral code if you have one" maxlength="10" />
                </div>

                <button type="submit" class="submit-btn" id="signupBtn">
                    <i class="fas fa-user-plus mr-2"></i> Create Account
                </button>
            </form>

            <!-- ✅ GOOGLE SIGN IN BUTTON -->
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">OR</div>
                <div class="divider-line"></div>
            </div>

            <button type="button" class="google-btn" onclick="handleGoogleSignIn()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
                Sign in with Google
            </button>

            <div class="bottom-text" id="bottomText">
                Don't have an account?
                <button onclick="switchTab('signup')">Sign Up</button>
            </div>
        </div>

        <div class="footer-note">
            By continuing, you agree to our <a href="index.html">Terms & Conditions</a>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="forgotModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Reset Password</h3>
            <p>Enter your email address and we'll send you a reset link.</p>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="email" id="forgotEmail" placeholder="you@example.com" />
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 18px;">
                <button type="button" onclick="closeForgotModal()" style="flex: 1; padding: 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #9ca3af; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 13px;">
                    Cancel
                </button>
                <button type="button" id="forgotBtn" onclick="handleForgotPassword()" style="flex: 1; padding: 13px; border-radius: 12px; border: none; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 13px;">
                    Send Link
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════ JAVASCRIPT ═══════════ -->
    <script>
        // ═══ FIREBASE CONFIG (efast-25f96) — NEW ═══
        const firebaseConfig = {
            apiKey: "AIzaSyD-fVkzumhCfVyXs7TUEaT0SmvvvPS5I8E",
            authDomain: "efast-25f96.firebaseapp.com",
            databaseURL: "https://efast-25f96-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "efast-25f96",
            storageBucket: "efast-25f96.firebasestorage.app",
            messagingSenderId: "741534475360",
            appId: "1:741534475360:web:ace117b7f90d927fa3cf05",
            measurementId: "G-W1WJ5PVTPK"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ─── TOAST ───
        function toast(type, message, duration = 3000) {
            const container = document.getElementById('toast-container');
            const iconMap = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.innerHTML = `<i class="fas ${iconMap[type] || 'fa-circle-info'}"></i> ${message}`;
            container.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transform = 'translateY(-10px)';
                div.style.transition = 'all 0.3s';
                setTimeout(() => div.remove(), 300);
            }, duration);
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('active', show);
        }

        // ─── TAB SWITCHING ───
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const bottomText = document.getElementById('bottomText');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                bottomText.innerHTML = `Don't have an account? <button onclick="switchTab('signup')">Sign Up</button>`;
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                bottomText.innerHTML = `Already have an account? <button onclick="switchTab('login')">Login</button>`;
            }
        }

        // ─── PASSWORD TOGGLE ───
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ─── LOGIN ───
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                toast('error', 'Please fill in all fields.');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';
            showLoader(true);

            try {
                await auth.signInWithEmailAndPassword(email, password);
                toast('success', 'Login successful! Redirecting...');

                const user = auth.currentUser;
                if (user) {
                    db.ref('users/' + user.uid).update({ lastLogin: new Date().toISOString() })
                        .catch(err => console.warn('lastLogin save failed:', err));
                }

                setTimeout(() => {
                    window.location.replace('index.html');
                }, 800);

            } catch (err) {
                console.error(err);
                showLoader(false);
                let msg = 'Login failed. Please try again.';
                if (err.code === 'auth/user-not-found') msg = 'No account found with this email.';
                else if (err.code === 'auth/wrong-password') msg = 'Incorrect password.';
                else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
                else if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
                else if (err.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
                else if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your internet.';
                toast('error', msg);

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Login';
            }
        }

        // ─── SIGNUP ───
        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const referral = document.getElementById('signupReferral').value.trim().toUpperCase();

            // ─── Validation ───
            if (!name || !email || !phone || !password || !confirm) {
                toast('error', 'Please fill in all fields.');
                return;
            }
            if (name.length < 2 || name.length > 60) {
                toast('error', 'Name must be 2-60 characters.');
                return;
            }
            if (password.length < 6) {
                toast('error', 'Password must be at least 6 characters.');
                return;
            }
            if (password !== confirm) {
                toast('error', 'Passwords do not match.');
                return;
            }
            if (!/^01[3-9]\d{8}$/.test(phone)) {
                toast('error', 'Please enter a valid Bangladeshi mobile number.');
                return;
            }
            if (referral && !/^[A-Z0-9]{4,10}$/.test(referral)) {
                toast('error', 'Invalid referral code format.');
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating account...';
            showLoader(true);

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = cred.user.uid;

                // ─── Referral lookup ───
                let referrerUid = null;
                let referrerData = null;

                if (referral) {
                    const refSnap = await db.ref('users').orderByChild('accountId').equalTo(referral).once('value');
                    if (refSnap.exists()) {
                        refSnap.forEach(child => {
                            referrerUid = child.key;
                            referrerData = child.val();
                        });
                    }
                }

                // ─── Self-referral block (same email check) ───
                if (referrerUid && referrerData && referrerData.email === email) {
                    referrerUid = null;
                    toast('info', 'Self-referral not allowed (ignored).');
                }

                const myAccountId = Math.floor(100000 + Math.random() * 900000).toString();

                // ─── Create user record ───
                await db.ref('users/' + uid).set({
                    uid: uid,
                    userName: name,
                    email: email,
                    userPhone: phone,
                    balance: 0,
                    referCount: 0,
                    accountId: myAccountId,
                    referredBy: referrerUid || '',
                    banned: false,
                    joinedAt: new Date().toISOString(),
                    createdAt: Date.now()
                });

                // ─── Referral rewards (RACE-SAFE with transaction) ───
                if (referrerUid) {
                    try {
                        const settingsSnap = await db.ref('appSettings').once('value');
                        const settings = settingsSnap.val() || {};
                        const reward = Number(settings.referPerEarn) || 0;

                        if (reward > 0) {
                            await db.ref('users/' + referrerUid + '/balance')
                                .transaction(c => (c || 0) + reward);

                            await db.ref('users/' + referrerUid + '/referCount')
                                .transaction(c => (c || 0) + 1);

                            await db.ref('transactions/' + referrerUid).push({
                                type: 'Referral Bonus',
                                description: `New user joined with your code +৳${reward}`,
                                amount: reward,
                                date: new Date().toISOString()
                            });

                            await db.ref('notifications/' + referrerUid).push({
                                title: '🎉 New Referral!',
                                message: `${name} joined using your code. You earned ৳${reward}!`,
                                type: 'referral',
                                sentAt: Date.now(),
                                read: false
                            });

                            await db.ref('users/' + referrerUid + '/referrals').push({
                                uid: uid,
                                name: name,
                                joinedAt: Date.now()
                            });
                        }
                    } catch (refErr) {
                        console.error('Referral reward failed:', refErr);
                    }
                }

                toast('success', 'Account created successfully!');
                showLoader(false);

                try {
                    await cred.user.updateProfile({ displayName: name });
                } catch (profileErr) {
                    console.warn('Profile displayName update failed:', profileErr);
                }

                setTimeout(() => {
                    window.location.replace('index.html');
                }, 900);

            } catch (err) {
                console.error(err);
                showLoader(false);
                let msg = 'Signup failed. Please try again.';
                if (err.code === 'auth/email-already-in-use') msg = 'This email is already registered.';
                else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
                else if (err.code === 'auth/weak-password') msg = 'Password is too weak.';
                else if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your internet.';
                toast('error', msg);

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus mr-2"></i> Create Account';
            }
        }

        // ✅ ─── GOOGLE SIGN IN ───
        async function handleGoogleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            
            // Try to get referral from signup form if it's filled
            const referral = document.getElementById('signupReferral').value.trim().toUpperCase();

            showLoader(true);

            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const isNewUser = result.additionalUserInfo.isNewUser;

                if (isNewUser) {
                    // নতুন ইউজার: মোবাইল নম্বর চাওয়া হবে
                    let phone = prompt("Welcome! Please enter your mobile number (e.g., 017XXXXXXXX) to complete signup:");
                    
                    // যদি ইউজার ক্যান্সেল করে বা ভুল নম্বর দেয়
                    if (!phone || !/^01[3-9]\d{8}$/.test(phone)) {
                        toast('error', 'Invalid mobile number. Please try again.');
                        showLoader(false);
                        await auth.signOut(); // অ্যাকাউন্ট তৈরি না করেই লগআউট
                        return;
                    }

                    // ─── Referral lookup ───
                    let referrerUid = null;
                    let referrerData = null;

                    if (referral) {
                        const refSnap = await db.ref('users').orderByChild('accountId').equalTo(referral).once('value');
                        if (refSnap.exists()) {
                            refSnap.forEach(child => {
                                referrerUid = child.key;
                                referrerData = child.val();
                            });
                        }
                    }

                    if (referrerUid && referrerData && referrerData.email === user.email) {
                        referrerUid = null;
                    }

                    const myAccountId = Math.floor(100000 + Math.random() * 900000).toString();

                    // ─── Create user record ───
                    await db.ref('users/' + user.uid).set({
                        uid: user.uid,
                        userName: user.displayName || 'User',
                        email: user.email,
                        userPhone: phone,
                        balance: 0,
                        referCount: 0,
                        accountId: myAccountId,
                        referredBy: referrerUid || '',
                        banned: false,
                        joinedAt: new Date().toISOString(),
                        createdAt: Date.now()
                    });

                    // ─── Referral rewards ───
                    if (referrerUid) {
                        try {
                            const settingsSnap = await db.ref('appSettings').once('value');
                            const settings = settingsSnap.val() || {};
                            const reward = Number(settings.referPerEarn) || 0;

                            if (reward > 0) {
                                await db.ref('users/' + referrerUid + '/balance')
                                    .transaction(c => (c || 0) + reward);
                                await db.ref('users/' + referrerUid + '/referCount')
                                    .transaction(c => (c || 0) + 1);
                                await db.ref('transactions/' + referrerUid).push({
                                    type: 'Referral Bonus',
                                    description: `New user joined with your code +৳${reward}`,
                                    amount: reward,
                                    date: new Date().toISOString()
                                });
                                await db.ref('notifications/' + referrerUid).push({
                                    title: '🎉 New Referral!',
                                    message: `${user.displayName || 'User'} joined using your code. You earned ৳${reward}!`,
                                    type: 'referral',
                                    sentAt: Date.now(),
                                    read: false
                                });
                                await db.ref('users/' + referrerUid + '/referrals').push({
                                    uid: user.uid,
                                    name: user.displayName || 'User',
                                    joinedAt: Date.now()
                                });
                            }
                        } catch (refErr) {
                            console.error('Referral reward failed:', refErr);
                        }
                    }
                    toast('success', 'Account created successfully!');
                } else {
                    // পুরনো ইউজার
                    toast('success', 'Login successful!');
                    db.ref('users/' + user.uid).update({ lastLogin: new Date().toISOString() })
                        .catch(err => console.warn('lastLogin save failed:', err));
                }

                showLoader(false);
                setTimeout(() => {
                    window.location.replace('index.html');
                }, 900);

            } catch (err) {
                console.error(err);
                showLoader(false);
                if (err.code === 'auth/popup-closed-by-user') {
                    toast('info', 'Sign-in cancelled.');
                } else if (err.code === 'auth/network-request-failed') {
                    toast('error', 'Network error. Check your internet.');
                } else {
                    toast('error', 'Google sign-in failed. Try again.');
                }
            }
        }

        // ─── FORGOT PASSWORD ───
        function openForgotModal() {
            document.getElementById('forgotModal').classList.add('open');
            const loginEmail = document.getElementById('loginEmail').value.trim();
            if (loginEmail) document.getElementById('forgotEmail').value = loginEmail;
        }
        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('open');
        }

        async function handleForgotPassword() {
            const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
            if (!email) {
                toast('error', 'Please enter your email address.');
                return;
            }

            const btn = document.getElementById('forgotBtn');
            btn.disabled = true;
            btn.innerText = 'Sending...';

            try {
                await auth.sendPasswordResetEmail(email);
                toast('success', 'Password reset link sent! Check your inbox.');
                closeForgotModal();
            } catch (err) {
                console.error(err);
                let msg = 'Failed to send reset link.';
                if (err.code === 'auth/user-not-found') msg = 'No account found with this email.';
                else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
                toast('error', msg);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Link';
            }
        }

        document.getElementById('forgotModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeForgotModal();
        });

        document.getElementById('forgotEmail').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleForgotPassword();
        });

        // ─── AUTO REDIRECT IF ALREADY LOGGED IN ───
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.replace('index.html');
            }
        });
    </script>
</body>
